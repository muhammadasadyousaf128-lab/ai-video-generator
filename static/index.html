<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1 Y Video Maker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Deep Dark Premium Background */
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            min-height: 100vh; 
            background: radial-gradient(circle at top, #1e1b4b, #020617); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            color: #f8fafc; 
        }
        
        /* Glassmorphism Premium Card */
        .container { 
            background: rgba(30, 41, 59, 0.8); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(251, 191, 36, 0.2); 
            border-radius: 24px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); 
            padding: 35px 25px; 
            max-width: 500px; 
            width: 100%; 
        }
        
        h1 { 
            text-align: center; 
            color: #fbbf24; 
            font-size: 28px; 
            margin-bottom: 5px; 
            font-weight: 800; 
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(251, 191, 36, 0.3);
        }
        
        .branding { 
            text-align: center; 
            color: #94a3b8; 
            font-size: 13px; 
            margin-bottom: 30px; 
            font-weight: 500; 
        }
        
        .branding span { 
            color: #fbbf24; 
            font-weight: bold; 
        }
        
        /* Input Fields */
        .input-group { display: flex; gap: 10px; margin-bottom: 25px; }
        input[type="text"] { 
            width: 100%; 
            padding: 16px 20px; 
            font-size: 15px; 
            background: #0f172a; 
            border: 2px solid #334155; 
            color: #f8fafc; 
            border-radius: 14px; 
            outline: none; 
            transition: all 0.3s; 
            font-weight: 500;
        }
        
        input[type="text"]:focus { 
            border-color: #fbbf24; 
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.2); 
        }
        
        input[type="text"]::placeholder { 
            color: #64748b; 
            font-weight: 400;
        }
        
        .label-text { 
            font-size: 13px; 
            color: #cbd5e1; 
            margin-bottom: 10px; 
            display: block; 
            font-weight: 600; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Toggle Buttons */
        .toggle-group { display: flex; gap: 12px; margin-bottom: 25px; }
        .toggle-btn { 
            flex: 1; 
            padding: 14px; 
            border: 2px solid #334155; 
            background: #0f172a; 
            color: #94a3b8; 
            border-radius: 14px; 
            cursor: pointer; 
            transition: all 0.3s; 
            font-weight: 600; 
            font-size: 14px; 
        }
        
        .toggle-btn.active { 
            border-color: #fbbf24; 
            background: rgba(251, 191, 36, 0.1); 
            color: #fbbf24; 
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.15);
        }
        
        .custom-box { display: none; margin-bottom: 25px; position: relative; }
        textarea { 
            width: 100%; 
            height: 110px; 
            padding: 16px; 
            background: #0f172a; 
            border: 2px solid #334155; 
            color: #f8fafc; 
            border-radius: 14px; 
            font-size: 15px; 
            resize: none; 
            outline: none; 
            font-family: inherit; 
            transition: all 0.3s;
        }
        
        textarea:focus { border-color: #fbbf24; }
        textarea::placeholder { color: #64748b; }
        
        /* Mic Button */
        .mic-btn { 
            position: absolute; 
            bottom: 15px; 
            right: 15px; 
            background: linear-gradient(135deg, #ef4444, #b91c1c); 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 48px; 
            height: 48px; 
            font-size: 22px; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); 
            transition: 0.3s; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .mic-btn.recording { 
            background: linear-gradient(135deg, #10b981, #059669); 
            animation: pulse 1.5s infinite; 
        }
        
        @keyframes pulse { 
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 
            70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } 
        }

        /* Main Generate Button */
        button.main-btn { 
            width: 100%; 
            padding: 18px; 
            font-size: 18px; 
            font-weight: 800; 
            background: linear-gradient(135deg, #fbbf24, #d97706); 
            color: #0f172a; 
            border: none; 
            border-radius: 14px; 
            cursor: pointer; 
            transition: all 0.3s; 
            box-shadow: 0 10px 25px -5px rgba(251, 191, 36, 0.4); 
            letter-spacing: 1px;
        }
        
        button.main-btn:hover:not(:disabled) { 
            transform: translateY(-2px); 
            box-shadow: 0 15px 30px -5px rgba(251, 191, 36, 0.6); 
        }
        
        button.main-btn:disabled { 
            opacity: 0.6; 
            cursor: not-allowed; 
            filter: grayscale(50%);
        }
        
        /* Status Messages */
        .status { 
            text-align: center; 
            padding: 15px; 
            border-radius: 12px; 
            margin-top: 20px; 
            font-weight: 600; 
            font-size: 14px;
            display: none; 
        }
        
        .status.loading { display: block; background: rgba(251, 191, 36, 0.1); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
        .status.success { display: block; background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status.error { display: block; background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        
        .spinner { 
            display: inline-block; 
            width: 18px; 
            height: 18px; 
            border: 3px solid rgba(251, 191, 36, 0.3); 
            border-top-color: #fbbf24; 
            border-radius: 50%; 
            animation: spin 0.8s linear infinite; 
            margin-right: 8px; 
            vertical-align: middle;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #timer { display: none; text-align: center; font-size: 13px; color: #94a3b8; margin-top: 12px; font-weight: 500;}
        
        /* Video Player */
        .video-wrapper { display: none; border-radius: 16px; overflow: hidden; box-shadow: 0 15px 30px rgba(0,0,0,0.5); margin-top: 25px; position: relative; border: 1px solid #334155; }
        video { width: 100%; display: block; background: black; }
        
        .play-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; backdrop-filter: blur(2px); }
        .play-overlay-btn { background: rgba(251, 191, 36, 0.9); color: #0f172a; border-radius: 50%; width: 75px; height: 75px; display: flex; align-items: center; justify-content: center; font-size: 35px; box-shadow: 0 0 20px rgba(251, 191, 36, 0.5); transition: transform 0.2s; padding-left: 5px;}
        .play-overlay:hover .play-overlay-btn { transform: scale(1.1); }
        
        /* Download & Share Buttons */
        .action-btns { display: flex; gap: 12px; margin-top: 20px; }
        .download-btn, .share-btn { 
            display: none; 
            flex: 1; 
            text-align: center; 
            padding: 15px; 
            color: white; 
            text-decoration: none; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 15px; 
            transition: all 0.3s; 
            border: none; 
            cursor: pointer; 
        }
        
        .download-btn { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3); }
        .download-btn:hover { transform: translateY(-2px); }
        
        .share-btn { background: linear-gradient(135deg, #25D366, #128C7E); box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3); }
        .share-btn:hover { transform: translateY(-2px); }
        
        @media (max-width: 600px) { 
            .container { padding: 25px 20px; } 
            h1 { font-size: 24px; } 
            .toggle-group { flex-direction: column; } 
            .action-btns { flex-direction: column; } 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>A1 Y Video Maker</h1>
        <p class="branding">An initiative by <span>A1 Yousaf Studio</span></p>

        <!-- Prompt Box (Empty with clear placeholder) -->
        <label class="label-text">1. Topic for Poetry</label>
        <div class="input-group">
            <input type="text" id="prompt" placeholder="Please write your topic name here... (e.g., Sad love story)" />
        </div>

        <!-- Poetry Type -->
        <label class="label-text">2. Poetry Type</label>
        <div class="toggle-group">
            <button id="btn-ai-poetry" class="toggle-btn active" onclick="setPoetryType('ai')">🤖 AI Poetry</button>
            <button id="btn-my-poetry" class="toggle-btn" onclick="setPoetryType('custom')">✍️ Apni Poetry</button>
        </div>

        <div id="customPoetryBox" class="custom-box">
            <textarea id="customPoetry" placeholder="Yahan apni poetry likhein (Roman Urdu) ya Mic dabakar bolein..."></textarea>
            <button id="micBtn" class="mic-btn" onclick="startSpeech()">🎤</button>
        </div>

        <!-- Background Type -->
        <label class="label-text">3. Video Background</label>
        <div class="toggle-group">
            <button id="btn-video" class="toggle-btn active" onclick="setBgType('video')">🎬 Moving Video</button>
            <button id="btn-image" class="toggle-btn" onclick="setBgType('image')">🖼️ AI Images</button>
        </div>

        <button id="generateBtn" class="main-btn" onclick="generate()">Generate Video</button>

        <div id="status" class="status"></div>
        <div id="timer"></div>

        <div id="videoWrapper" class="video-wrapper">
            <video id="video" controls playsinline preload="auto" webkit-playsinline></video>
            <div id="playOverlay" class="play-overlay" onclick="playWithSound()">
                <div class="play-overlay-btn">▶</div>
            </div>
        </div>

        <div class="action-btns">
            <a id="downloadBtn" href="#" download="a1-y-video.mp4" class="download-btn">⬇️ Download</a>
            <a id="shareBtn" href="#" target="_blank" class="share-btn">📲 Share</a>
        </div>
    </div>

    <script>
        const BACKEND = window.location.origin;
        let currentBgType = 'video';
        let currentPoetryType = 'ai';
        let recognition;
        let timerInterval;
        let secondsElapsed = 0;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ur-PK'; 

            recognition.onresult = function(event) {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    }
                }
                if (finalTranscript) {
                    document.getElementById('customPoetry').value += finalTranscript + " ";
                }
            };

            recognition.onerror = function(event) {
                alert("Mic Error: " + event.error);
                document.getElementById('micBtn').classList.remove('recording');
                document.getElementById('micBtn').innerText = "🎤";
            };
        } else {
            alert("Aapka browser Voice-to-Text support nahi karta. Please Chrome use karein.");
        }

        function startSpeech() {
            if (!recognition) return;
            const micBtn = document.getElementById('micBtn');
            if (micBtn.classList.contains('recording')) {
                recognition.stop();
                micBtn.classList.remove('recording');
                micBtn.innerText = "🎤";
            } else {
                recognition.start();
                micBtn.classList.add('recording');
                micBtn.innerText = "⏹️";
            }
        }

        function setPoetryType(type) {
            currentPoetryType = type;
            document.getElementById('btn-ai-poetry').classList.remove('active');
            document.getElementById('btn-my-poetry').classList.remove('active');
            document.getElementById('btn-' + (type === 'ai' ? 'ai-poetry' : 'my-poetry')).classList.add('active');
            document.getElementById('customPoetryBox').style.display = type === 'custom' ? 'block' : 'none';
        }

        function setBgType(type) {
            currentBgType = type;
            document.getElementById('btn-video').classList.remove('active');
            document.getElementById('btn-image').classList.remove('active');
            document.getElementById('btn-' + type).classList.add('active');
        }

        function playWithSound() {
            const videoEl = document.getElementById('video');
            const overlay = document.getElementById('playOverlay');
            overlay.style.display = 'none';
            videoEl.muted = false;
            videoEl.volume = 1.0;
            videoEl.play();
        }

        function startTimer() {
            secondsElapsed = 0;
            const timerEl = document.getElementById('timer');
            timerEl.style.display = 'block';
            timerEl.innerText = "⏱️ Time Elapsed: 0s (Est. wait: 30-60s)";
            
            timerInterval = setInterval(() => {
                secondsElapsed++;
                timerEl.innerText = `⏱️ Time Elapsed: ${secondsElapsed}s (Est. wait: 30-60s)`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            document.getElementById('timer').style.display = 'none';
        }

        async function generate() {
            const prompt = document.getElementById('prompt').value;
            const customPoetry = document.getElementById('customPoetry').value;
            const statusEl = document.getElementById('status');
            const videoEl = document.getElementById('video');
            const videoWrapper = document.getElementById('videoWrapper');
            const playOverlay = document.getElementById('playOverlay');
            const downloadBtn = document.getElementById('downloadBtn');
            const shareBtn = document.getElementById('shareBtn');
            const btn = document.getElementById('generateBtn');

            if (!prompt.trim()) {
                statusEl.className = 'status error';
                statusEl.innerText = '⚠️ Please write your topic name first!';
                statusEl.style.display = 'block';
                return;
            }
            if (currentPoetryType === 'custom' && !customPoetry.trim()) {
                statusEl.className = 'status error';
                statusEl.innerText = '⚠️ Apni poetry likhein ya Mic dabayein';
                statusEl.style.display = 'block';
                return;
            }

            statusEl.className = 'status loading';
            statusEl.innerHTML = '<span class="spinner"></span> Video ban rahi hai...';
            videoWrapper.style.display = 'none';
            downloadBtn.style.display = 'none'; 
            shareBtn.style.display = 'none'; 
            btn.disabled = true;
            btn.innerText = 'Please wait...';
            
            startTimer();

            try {
                const res = await fetch(BACKEND + '/generate-video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: prompt, 
                        background_type: currentBgType,
                        poetry_type: currentPoetryType,
                        custom_poetry: customPoetry
                    })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    const url = BACKEND + data.video_url;
                    statusEl.className = 'status success';
                    statusEl.innerText = '✅ Video ready!';
                    
                    videoEl.src = url;
                    videoWrapper.style.display = 'block';
                    playOverlay.style.display = 'flex';
                    
                    downloadBtn.href = url;
                    downloadBtn.style.display = 'block'; 
                    
                    const message = "Maine yeh AI video A1 Yousaf Studio se banayi hai. Dekhein:\n" + url;
                    shareBtn.href = "https://wa.me/?text=" + encodeURIComponent(message);
                    shareBtn.style.display = 'block';
                } else {
                    statusEl.className = 'status error';
                    statusEl.innerText = '❌ Error: ' + data.message;
                }
            } catch (e) {
                statusEl.className = 'status error';
                statusEl.innerText = '❌ Connection error.';
            } finally {
                stopTimer();
                btn.disabled = false;
                btn.innerText = 'Generate Video';
            }
        }
    </script>
</body>
</html>
