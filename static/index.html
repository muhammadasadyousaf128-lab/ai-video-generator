<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1 Y Video Maker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; background: #1a1a2e; display: flex; align-items: center; justify-content: center; padding: 20px; color: white; }
        
        .container { background: #f8f9fa; border: 1px solid #ddd; border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); padding: 30px; max-width: 800px; width: 100%; color: #333; }
        
        h1 { text-align: center; color: #4a4e69; font-size: 30px; margin-bottom: 5px; font-weight: 800; }
        .branding { text-align: center; color: #777; font-size: 14px; margin-bottom: 25px; font-weight: 600; }
        .branding span { color: #6a67ce; font-weight: bold; }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 15px 20px; font-size: 16px; background: #fff; border: 2px solid #ddd; color: #333; border-radius: 12px; outline: none; transition: all 0.3s; }
        input[type="text"]:focus { border-color: #6a67ce; box-shadow: 0 0 10px rgba(106, 103, 206, 0.2); }
        
        .label-text { font-size: 14px; color: #555; margin-bottom: 8px; display: block; font-weight: bold; }
        
        /* Toggle Buttons */
        .toggle-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .toggle-btn { flex: 1; padding: 12px; border: 2px solid #ddd; background: #fff; color: #777; border-radius: 12px; cursor: pointer; transition: all 0.3s; font-weight: 600; font-size: 14px; }
        .toggle-btn.active { border-color: #6a67ce; background: #f0f0ff; color: #6a67ce; box-shadow: 0 0 10px rgba(106, 103, 206, 0.1); }
        
        .custom-box { display: none; margin-bottom: 20px; position: relative; }
        textarea { width: 100%; height: 100px; padding: 15px; background: #fff; border: 2px solid #ddd; color: #333; border-radius: 12px; font-size: 15px; resize: none; outline: none; font-family: inherit; }
        textarea:focus { border-color: #6a67ce; }
        
        /* Mic Button */
        .mic-btn { position: absolute; bottom: 15px; right: 15px; background: #ff4757; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; font-size: 20px; cursor: pointer; box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4); transition: 0.3s; }
        .mic-btn.recording { background: #2ed573; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46, 213, 115, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(46, 213, 115, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 213, 115, 0); } }

        button.main-btn { width: 100%; padding: 18px; font-size: 18px; font-weight: bold; background: linear-gradient(135deg, #6a67ce, #4a4e69); color: white; border: none; border-radius: 12px; cursor: pointer; transition: all 0.3s; box-shadow: 0 5px 15px rgba(106, 103, 206, 0.3); }
        button.main-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(106, 103, 206, 0.5); }
        button.main-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .status { text-align: center; padding: 15px; border-radius: 12px; margin-top: 20px; font-weight: 600; display: none; }
        .status.loading { display: block; background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .status.success { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status.error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(0,0,0,0.1); border-top-color: #856404; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 10px; vertical-align: middle;}
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #timer { display: none; text-align: center; font-size: 14px; color: #555; margin-top: 10px; }
        
        .video-wrapper { display: none; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-top: 20px; position: relative; }
        video { width: 100%; display: block; background: black; }
        
        .play-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; }
        .play-overlay-btn { background: rgba(255, 255, 255, 0.9); color: #333; border-radius: 50%; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.2s; }
        
        .action-btns { display: flex; gap: 10px; margin-top: 15px; }
        .download-btn, .share-btn { display: none; flex: 1; text-align: center; padding: 15px; color: white; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 16px; transition: all 0.3s; border: none; cursor: pointer; }
        .download-btn { background: #28a745; }
        .share-btn { background: #25D366; }
        
        @media (max-width: 600px) { .container { padding: 20px; } h1 { font-size: 24px; } .toggle-group { flex-direction: column; } .action-btns { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>A1 Y Video Maker</h1>
        <p class="branding">An initiative by <span>A1 Yousaf Studio</span></p>

        <label class="label-text">1. Konsi Story ya Topic par Poetry chahiye?</label>
        <div class="input-group">
            <input type="text" id="prompt" placeholder="Yahan likhein (e.g., Sad love story, Motivational...)" value="Sad love story" />
        </div>

        <label class="label-text">2. Poetry kaisi chahiye?</label>
        <div class="toggle-group">
            <button id="btn-ai-poetry" class="toggle-btn active" onclick="setPoetryType('ai')">🤖 AI Poetry (Auto)</button>
            <button id="btn-my-poetry" class="toggle-btn" onclick="setPoetryType('custom')">✍️ Apni Poetry (Custom)</button>
        </div>

        <div id="customPoetryBox" class="custom-box">
            <textarea id="customPoetry" placeholder="Yahan apni poetry likhein (Roman Urdu) ya Mic dabakar bolein..."></textarea>
            <button id="micBtn" class="mic-btn" onclick="startSpeech()">🎤</button>
        </div>

        <label class="label-text">3. Video ka Background kaisa ho?</label>
        <div class="toggle-group">
            <button id="btn-video" class="toggle-btn active" onclick="setBgType('video')">🎬 Moving Video (Reels)</button>
            <button id="btn-image" class="toggle-btn" onclick="setBgType('image')">🖼️ AI Images (Photos)</button>
        </div>

        <button id="generateBtn" class="main-btn" onclick="generate()">Generate Video</button>

        <div id="status" class="status"></div>
        <div id="timer"></div>

        <div id="videoWrapper" class="video-wrapper">
            <video id="video" controls playsinline preload="auto" webkit-playsinline></video>
            <div id="playOverlay" class="play-overlay" onclick="playWithSound()">
                <div class="play-overlay-btn">▶️</div>
            </div>
        </div>

        <div class="action-btns">
            <a id="downloadBtn" href="#" download="a1-y-video.mp4" class="download-btn">⬇️ Download</a>
            <a id="shareBtn" href="#" target="_blank" class="share-btn">📲 Share on WhatsApp</a>
        </div>
    </div>

    <script>
        const BACKEND = window.location.origin;
        let currentBgType = 'video';
        let currentPoetryType = 'ai';
        let recognition;
        let timerInterval;
        let secondsElapsed = 0;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ur-PK'; 

            recognition.onresult = function(event) {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    }
                }
                if (finalTranscript) {
                    document.getElementById('customPoetry').value += finalTranscript + " ";
                }
            };

            recognition.onerror = function(event) {
                alert("Mic Error: " + event.error);
                document.getElementById('micBtn').classList.remove('recording');
                document.getElementById('micBtn').innerText = "🎤";
            };
        } else {
            alert("Aapka browser Voice-to-Text support nahi karta. Please Chrome use karein.");
        }

        function startSpeech() {
            if (!recognition) return;
            const micBtn = document.getElementById('micBtn');
            if (micBtn.classList.contains('recording')) {
                recognition.stop();
                micBtn.classList.remove('recording');
                micBtn.innerText = "🎤";
            } else {
                recognition.start();
                micBtn.classList.add('recording');
                micBtn.innerText = "⏹️";
            }
        }

        function setPoetryType(type) {
            currentPoetryType = type;
            document.getElementById('btn-ai-poetry').classList.remove('active');
            document.getElementById('btn-my-poetry').classList.remove('active');
            document.getElementById('btn-' + (type === 'ai' ? 'ai-poetry' : 'my-poetry')).classList.add('active');
            document.getElementById('customPoetryBox').style.display = type === 'custom' ? 'block' : 'none';
        }

        function setBgType(type) {
            currentBgType = type;
            document.getElementById('btn-video').classList.remove('active');
            document.getElementById('btn-image').classList.remove('active');
            document.getElementById('btn-' + type).classList.add('active');
        }

        function playWithSound() {
            const videoEl = document.getElementById('video');
            const overlay = document.getElementById('playOverlay');
            overlay.style.display = 'none';
            videoEl.muted = false;
            videoEl.volume = 1.0;
            videoEl.play();
        }

        function startTimer() {
            secondsElapsed = 0;
            const timerEl = document.getElementById('timer');
            timerEl.style.display = 'block';
            timerEl.innerText = "⏱️ Time Elapsed: 0s (Est. wait: 30-60s)";
            
            timerInterval = setInterval(() => {
                secondsElapsed++;
                timerEl.innerText = `⏱️ Time Elapsed: ${secondsElapsed}s (Est. wait: 30-60s)`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            document.getElementById('timer').style.display = 'none';
        }

        async function generate() {
            const prompt = document.getElementById('prompt').value;
            const customPoetry = document.getElementById('customPoetry').value;
            const statusEl = document.getElementById('status');
            const videoEl = document.getElementById('video');
            const videoWrapper = document.getElementById('videoWrapper');
            const playOverlay = document.getElementById('playOverlay');
            const downloadBtn = document.getElementById('downloadBtn');
            const shareBtn = document.getElementById('shareBtn');
            const btn = document.getElementById('generateBtn');

            if (!prompt.trim()) {
                statusEl.className = 'status error';
                statusEl.innerText = '⚠️ Topic likhna zaroori hai';
                statusEl.style.display = 'block';
                return;
            }
            if (currentPoetryType === 'custom' && !customPoetry.trim()) {
                statusEl.className = 'status error';
                statusEl.innerText = '⚠️ Apni poetry likhein ya Mic dabayein';
                statusEl.style.display = 'block';
                return;
            }

            statusEl.className = 'status loading';
            statusEl.innerHTML = '<span class="spinner"></span> Video ban rahi hai...';
            videoWrapper.style.display = 'none';
            downloadBtn.style.display = 'none'; 
            shareBtn.style.display = 'none'; 
            btn.disabled = true;
            btn.innerText = 'Please wait...';
            
            startTimer();

            try {
                const res = await fetch(BACKEND + '/generate-video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: prompt, 
                        background_type: currentBgType,
                        poetry_type: currentPoetryType,
                        custom_poetry: customPoetry
                    })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    const url = BACKEND + data.video_url;
                    statusEl.className = 'status success';
                    statusEl.innerText = '✅ Video ready!';
                    
                    videoEl.src = url;
                    videoWrapper.style.display = 'block';
                    playOverlay.style.display = 'flex';
                    
                    downloadBtn.href = url;
                    downloadBtn.style.display = 'block'; 
                    
                    const message = "Maine yeh AI video A1 Yousaf Studio se banayi hai. Dekhein:\n" + url;
                    shareBtn.href = "https://wa.me/?text=" + encodeURIComponent(message);
                    shareBtn.style.display = 'block';
                } else {
                    statusEl.className = 'status error';
                    statusEl.innerText = '❌ Error: ' + data.message;
                }
            } catch (e) {
                statusEl.className = 'status error';
                statusEl.innerText = '❌ Connection error.';
            } finally {
                stopTimer();
                btn.disabled = false;
                btn.innerText = 'Generate Video';
            }
        }
    </script>
</body>
</html>
