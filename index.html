<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 600;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status.idle { background: #f0f0f0; color: #666; }
        .status.loading { background: #fff3cd; color: #856404; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,0.1);
            border-top-color: #856404;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .video-wrapper {
            display: none;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        video {
            width: 100%;
            display: block;
            background: black;
        }

        @media (max-width: 600px) {
            .container { padding: 25px; }
            h1 { font-size: 24px; }
            .input-group { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Video Generator</h1>
        <p class="subtitle">Apna prompt likho aur video banao</p>

        <div class="input-group">
            <input id="prompt" placeholder="Enter your prompt..." value="Motivational sad story" />
            <button id="generateBtn" onclick="generate()">Generate Video</button>
        </div>

        <div id="status" class="status idle">Ready to create</div>

        <div id="videoWrapper" class="video-wrapper">
            <video id="video" controls playsinline preload="auto" webkit-playsinline></video>
        </div>
    </div>

    <script>
        // Automatic detection: jahan se page khula, wahi backend URL use karo
        const BACKEND = window.location.origin;

        async function generate() {
            const prompt = document.getElementById('prompt').value;
            const statusEl = document.getElementById('status');
            const videoEl = document.getElementById('video');
            const videoWrapper = document.getElementById('videoWrapper');
            const btn = document.getElementById('generateBtn');

            if (!prompt.trim()) {
                statusEl.className = 'status error';
                statusEl.innerText = '⚠️ Prompt likhna zaroori hai';
                return;
            }

            statusEl.className = 'status loading';
            statusEl.innerHTML = '<span class="spinner"></span> Video ban rahi hai... (30-60 sec)';
            videoWrapper.style.display = 'none';
            btn.disabled = true;
            btn.innerText = 'Please wait...';

            try {
                const res = await fetch(BACKEND + '/generate-video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    const url = BACKEND + data.video_url;
                    statusEl.className = 'status success';
                    statusEl.innerText = '✅ Video ready!';
                    videoEl.src = url;
                    videoWrapper.style.display = 'block';
                    videoEl.play();
                } else {
                    statusEl.className = 'status error';
                    statusEl.innerText = '❌ Error: ' + data.message;
                }
            } catch (e) {
                statusEl.className = 'status error';
                statusEl.innerText = '❌ Connection error. Backend chal raha hai?';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Generate Video';
            }
        }

        document.getElementById('prompt').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') generate();
        });
    </script>
</body>
</html>
